plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "creative_ciller" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = "https://sonatype.org" }

    mavenCentral()

    gradlePluginPortal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation 'me.lucko:fabric-permissions-api:0.7.0'
    include 'me.lucko:fabric-permissions-api:0.7.0'
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}



processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", "26.3"
    inputs.property "loader_version", "0.16.10"
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": "26.3",
                "loader_version": "0.16.10"
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

